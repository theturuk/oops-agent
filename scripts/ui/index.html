<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oops Timeline</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --panel-2: #fbfaf8; --border: #e6e3dc; --border-strong: #d6d2c9;
  --text: #1d1b18; --muted: #77716a; --faint: #a7a199;
  --accent: #e8590c; --accent-soft: #fff0e6;
  --add-bg: #e9f7ee; --add-fg: #1f7a3c; --add-strong: #c4ebd1;
  --del-bg: #fdeeec; --del-fg: #b42318; --del-strong: #f6c9c3;
  --mod-fg: #a15c00;
  --c-shell: #e8590c; --c-edit: #1c7ed6; --c-write: #2f9e44; --c-restore: #7048e8; --c-external: #868e96;
  --shadow: 0 1px 2px rgba(20, 16, 10, .06), 0 4px 16px rgba(20, 16, 10, .06);
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121110; --panel: #1b1a18; --panel-2: #201f1c; --border: #2e2c29; --border-strong: #3c3935;
    --text: #eeebe5; --muted: #a09a91; --faint: #6d6861;
    --accent: #ff7b39; --accent-soft: #3a2214;
    --add-bg: #10291a; --add-fg: #79d99a; --add-strong: #1b4a2d;
    --del-bg: #33150f; --del-fg: #ff9d90; --del-strong: #5c2219;
    --mod-fg: #f0b45a;
    --c-shell: #ff7b39; --c-edit: #4dabf7; --c-write: #51cf66; --c-restore: #9775fa; --c-external: #adb5bd;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); }

/* ---------- header ---------- */
header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); min-width: 0; }
.logo { font-weight: 850; font-size: 20px; letter-spacing: -0.8px; flex: none; }
.logo span { color: var(--accent); }
.proj { min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.proj b { font-size: 14px; }
.proj small { color: var(--muted); font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats { margin-left: auto; display: flex; gap: 8px; flex: none; }
.stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--muted); }
.stat b { color: var(--text); font-variant-numeric: tabular-nums; }

/* ---------- layout ---------- */
.body { display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: 0; }
.steps { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--border); padding: 10px; }
.steps-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 6px 8px 8px; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.step:hover { background: var(--panel-2); }
.step.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; font-family: var(--mono); }
.t-shell { background: var(--c-shell); } .t-edit { background: var(--c-edit); } .t-write { background: var(--c-write); }
.t-restore { background: var(--c-restore); } .t-external { background: var(--c-external); }
.step .what { font-weight: 600; font-size: 13px; }
.step .detail { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .when { font-size: 11px; color: var(--faint); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.step .nfiles { display: inline-block; margin-top: 2px; font-size: 11px; color: var(--muted); }
.step.failed .what::after { content: " · failed"; color: var(--del-fg); font-weight: 500; }

main { overflow-y: auto; padding: 22px 26px 30px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.head { padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.head .kicker { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; color: #fff; }
.head h1 { font-size: 18px; margin: 8px 0 0; font-weight: 700; letter-spacing: -0.2px; }
.cmd { margin-top: 12px; font-family: var(--mono); font-size: 12.5px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: auto; }
.cmd::before { content: "$ "; color: var(--accent); font-weight: 700; }
.btn { border: 1px solid var(--border-strong); background: var(--panel); border-radius: 9px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, transform .05s; }
.btn:hover { background: var(--panel-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.confirm { background: var(--del-fg); border-color: var(--del-fg); color: #fff; }
.btn.small { padding: 5px 11px; font-size: 12px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0 12px; }
.tab { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-family: var(--mono); font-size: 12px; cursor: pointer; max-width: 100%; }
.tab span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab:hover { border-color: var(--border-strong); }
.tab.active { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.mk { font-weight: 900; }
.mk.add { color: var(--add-fg); } .mk.del { color: var(--del-fg); } .mk.mod { color: var(--mod-fg); }

.file { overflow: hidden; }
.file-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
.file-bar .name { font-family: var(--mono); font-size: 12.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-bar .counts { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.file-bar .counts .a { color: var(--add-fg); } .file-bar .counts .d { color: var(--del-fg); }
.file-bar .btn { margin-left: auto; }
.diff { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; overflow-x: auto; }
.ln { display: grid; grid-template-columns: 46px 46px 18px minmax(0, 1fr); }
.ln > span { white-space: pre-wrap; word-break: break-all; }
.num { color: var(--faint); text-align: right; padding-right: 10px; user-select: none; font-size: 11.5px; }
.sign { user-select: none; text-align: center; color: var(--faint); }
.ln.add { background: var(--add-bg); } .ln.add .num { background: var(--add-strong); color: var(--add-fg); } .ln.add .sign, .ln.add .code { color: var(--add-fg); }
.ln.del { background: var(--del-bg); } .ln.del .num { background: var(--del-strong); color: var(--del-fg); } .ln.del .sign, .ln.del .code { color: var(--del-fg); }
.gap { padding: 5px 16px; color: var(--muted); background: var(--panel-2); font-size: 11.5px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.note { padding: 36px 20px; text-align: center; color: var(--muted); }
.imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
.imgs figure { margin: 0; padding: 14px; background: var(--panel); }
.imgs figcaption { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.imgs img { max-width: 100%; display: block; margin: 0 auto; border-radius: 6px; background: repeating-conic-gradient(var(--panel-2) 0 25%, var(--bg) 0 50%) 0 0 / 16px 16px; }

.empty { display: grid; place-items: center; height: 100%; text-align: center; color: var(--muted); padding: 40px; }
.empty .big { font-size: 44px; font-weight: 850; color: var(--text); letter-spacing: -1.5px; }
.empty .big span { color: var(--accent); }

/* ---------- player ---------- */
footer { background: var(--panel); border-top: 1px solid var(--border); padding: 12px 22px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.play { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center; box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 40%, transparent); }
.play svg { width: 18px; height: 18px; fill: currentColor; }
.play:hover { filter: brightness(1.06); }
.scrub { min-width: 0; }
.scrub-top { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.scrub-top b { color: var(--text); font-weight: 650; }
.track { position: relative; height: 26px; }
.track input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 3; }
.rail { position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: 99px; background: var(--border); }
.fill { position: absolute; left: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.mark { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; border: 2px solid var(--panel); z-index: 1; }
.thumb { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--panel); border: 4px solid var(--accent); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); z-index: 2; pointer-events: none; transition: left .15s ease; }
.track:hover .thumb { transform: scale(1.08); }
.legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(10px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: var(--shadow); z-index: 10; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--del-fg); color: #fff; }

@media (max-width: 860px) {
  body { overflow: auto; height: auto; min-height: 100%; }
  .body { grid-template-columns: 1fr; }
  .steps { max-height: 34vh; border-right: none; border-bottom: 1px solid var(--border); }
  main { padding: 16px; }
  .head { grid-template-columns: 1fr; }
  .legend { display: none; }
  footer { position: sticky; bottom: 0; grid-template-columns: auto minmax(0, 1fr); padding: 10px 16px 12px; }
  .stats .stat:not(:first-child) { display: none; }
  .imgs { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="logo">oops<span>!</span></div>
  <div class="proj"><b id="projName">…</b><small id="projPath"></small></div>
  <div class="stats" id="stats"></div>
</header>
<div class="body">
  <nav class="steps" id="steps"></nav>
  <main id="main"></main>
</div>
<footer>
  <button class="play" id="play" title="Play (space)" aria-label="Play"></button>
  <div class="scrub">
    <div class="scrub-top"><span id="tStart"></span><span id="tNow"></span><span id="tEnd"></span></div>
    <div class="track">
      <div class="rail"></div><div class="fill" id="fill"></div><div id="marks"></div><div class="thumb" id="thumb"></div>
      <input type="range" id="slider" min="0" max="0" value="0" aria-label="Timeline">
    </div>
  </div>
  <div class="legend">
    <span><i style="background:var(--c-shell)"></i>shell</span>
    <span><i style="background:var(--c-edit)"></i>edit</span>
    <span><i style="background:var(--c-write)"></i>write</span>
    <span><i style="background:var(--c-restore)"></i>restore</span>
  </div>
</footer>
<div class="toast" id="toast"></div>
<script>
const token = new URLSearchParams(location.search).get('token');
const api = (p, opts) => fetch(`${p}${p.includes('?') ? '&' : '?'}token=${token}`, opts).then(async (r) => {
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
});
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>';

let events = [];
let idx = 0;
let fileIdx = 0;
let playing = null;
const blobCache = new Map();

const TYPES = {
  Bash: { cls: 't-shell', icon: '$', label: 'Shell command', color: 'var(--c-shell)' },
  PowerShell: { cls: 't-shell', icon: '$', label: 'PowerShell command', color: 'var(--c-shell)' },
  Edit: { cls: 't-edit', icon: '✎', label: 'Edited', color: 'var(--c-edit)' },
  MultiEdit: { cls: 't-edit', icon: '✎', label: 'Edited', color: 'var(--c-edit)' },
  NotebookEdit: { cls: 't-edit', icon: '✎', label: 'Edited notebook', color: 'var(--c-edit)' },
  Write: { cls: 't-write', icon: '+', label: 'Wrote', color: 'var(--c-write)' },
  oops: { cls: 't-restore', icon: '↺', label: 'Restored', color: 'var(--c-restore)' },
  external: { cls: 't-external', icon: '?', label: 'Changed outside the agent', color: 'var(--c-external)' },
};
const typeOf = (e) => TYPES[e.tool] || { cls: 't-external', icon: '•', label: e.tool, color: 'var(--c-external)' };
const isShell = (e) => e.tool === 'Bash' || e.tool === 'PowerShell';
const kind = (c) => (!c.b ? 'add' : !c.a ? 'del' : 'mod');
const MK = { add: '+', del: '−', mod: '~' };
const VERB = { add: 'created', del: 'deleted', mod: 'modified' };

const clock = (t) => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
function ago(t) {
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} d ago`;
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function stepTitle(e) {
  if (isShell(e)) return typeOf(e).label;
  const t = typeOf(e);
  if (e.tool === 'oops' || e.tool === 'external') return t.label;
  return `${t.label} ${e.changes.length === 1 ? e.changes[0].p.split('/').pop() : plural(e.changes.length, 'file')}`;
}
function stepDetail(e) {
  if (isShell(e)) return e.summary.split('\n')[0];
  return e.changes.map((c) => c.p).join(', ');
}

async function load(jumpToEnd) {
  const data = await api('/api/events');
  const wasLen = events.length;
  events = data.events;
  const parts = data.root.split(/[\\/]/);
  $('projName').textContent = parts[parts.length - 1] || data.root;
  $('projPath').textContent = data.root;
  const files = new Set(events.flatMap((e) => e.changes.map((c) => c.p)));
  const restores = events.filter((e) => e.tool === 'oops').length;
  $('stats').innerHTML = `<span class="stat"><b>${events.length}</b> steps</span><span class="stat"><b>${files.size}</b> files</span><span class="stat"><b>${restores}</b> restores</span>`;
  $('slider').max = Math.max(0, events.length - 1);
  if (jumpToEnd || idx >= events.length) idx = Math.max(0, events.length - 1);
  if (events.length) {
    $('tStart').textContent = clock(events[0].t);
    $('tEnd').textContent = clock(events[events.length - 1].t);
  }
  renderMarks();
  renderSteps();
  select(idx, wasLen !== events.length);
}

const pct = (i) => (events.length <= 1 ? 100 : (i / (events.length - 1)) * 100);

function renderMarks() {
  $('marks').innerHTML = events.map((e, i) => `<div class="mark" style="left:${pct(i)}%;background:${typeOf(e).color}"></div>`).join('');
}

function renderSteps() {
  if (!events.length) { $('steps').innerHTML = ''; return; }
  $('steps').innerHTML = `<div class="steps-title">Agent steps · newest first</div>` + events.map((e, i) => {
    const t = typeOf(e);
    return `<div class="step${e.failed ? ' failed' : ''}" data-i="${i}">
      <div class="ico ${t.cls}">${t.icon}</div>
      <div style="min-width:0"><div class="what">${esc(stepTitle(e))}</div><div class="detail">${esc(stepDetail(e))}</div>
        <span class="nfiles">${plural(e.changes.length, 'file')}</span></div>
      <div class="when">${clock(e.t)}</div></div>`;
  }).reverse().join('');
  $('steps').querySelectorAll('.step').forEach((el) => el.onclick = () => { stop(); select(Number(el.dataset.i), true); });
}

function select(i, resetFile) {
  idx = i;
  if (resetFile) fileIdx = 0;
  $('slider').value = i;
  $('thumb').style.left = `${pct(i)}%`;
  $('fill').style.width = `${pct(i)}%`;
  document.querySelectorAll('.step').forEach((el) => {
    const on = Number(el.dataset.i) === i;
    el.classList.toggle('active', on);
    if (on) el.scrollIntoView({ block: 'nearest' });
  });
  const e = events[i];
  if (!e) {
    $('main').innerHTML = `<div class="empty"><div><div class="big">oops<span>!</span></div>
      <p>Nothing recorded yet.<br>Let your agent work. Every change it makes will show up here.</p></div></div>`;
    $('tNow').textContent = '';
    return;
  }
  $('tNow').innerHTML = `<b>Step ${i + 1} of ${events.length}</b> · ${ago(e.t)}`;
  const t = typeOf(e);
  const c = e.changes[fileIdx] || e.changes[0];
  $('main').innerHTML = `
    <div class="card head">
      <div style="min-width:0">
        <div class="kicker"><span class="pill ${t.cls}">${esc(t.label.toUpperCase())}</span>
          <span>${new Date(e.t).toLocaleString()}</span><span>·</span><span>${plural(e.changes.length, 'file')} changed</span>
          ${e.failed ? '<span style="color:var(--del-fg)">· command failed</span>' : ''}</div>
        ${isShell(e) ? `<div class="cmd">${esc(e.summary)}</div>` : `<h1>${esc(stepTitle(e))}</h1>`}
      </div>
      <button class="btn primary" id="undoStep" title="Put every file back the way it was right before this step">↺ Undo this step &amp; everything after</button>
    </div>
    <div class="tabs">${e.changes.map((x, j) => `<button class="tab${j === fileIdx ? ' active' : ''}" data-j="${j}">
      <span class="mk ${kind(x)}">${MK[kind(x)]}</span><span>${esc(x.p)}</span></button>`).join('')}</div>
    <div class="card file">
      <div class="file-bar"><span class="name">${esc(c.p)}</span><span class="counts" id="counts">${VERB[kind(c)]}</span>
        <button class="btn small" id="undoFile">Restore just this file</button></div>
      <div id="viewer"><div class="note">Loading…</div></div>
    </div>`;
  $('main').querySelectorAll('.tab').forEach((b) => b.onclick = () => { fileIdx = Number(b.dataset.j); select(idx); });
  confirmButton($('undoStep'), () => restore({ id: e.id }));
  confirmButton($('undoFile'), () => restore({ id: e.id, file: c.p }));
  renderFile(c);
}

async function blob(hash, p) {
  if (!hash) return { binary: false, text: '' };
  if (!blobCache.has(hash)) blobCache.set(hash, api(`/api/blob?hash=${hash}&p=${encodeURIComponent(p)}`));
  return blobCache.get(hash);
}

async function renderFile(c) {
  const myIdx = idx, myFile = fileIdx;
  let b, a;
  try { [b, a] = await Promise.all([blob(c.b, c.p), blob(c.a, c.p)]); } catch (err) {
    if ($('viewer')) $('viewer').innerHTML = `<div class="note">${esc(err.message)}</div>`; return;
  }
  if (myIdx !== idx || myFile !== fileIdx || !$('viewer')) return;
  if (a.binary || b.binary) {
    if (a.image || b.image) {
      const img = (h, cap) => `<figure><figcaption>${cap}</figcaption>${h ? `<img alt="${cap}" src="/api/blob?hash=${h}&p=${encodeURIComponent(c.p)}&raw=1&token=${token}">` : '<div class="note">—</div>'}</figure>`;
      $('viewer').innerHTML = `<div class="imgs">${img(c.b, 'Before')}${img(c.a, 'After')}</div>`;
    } else {
      $('viewer').innerHTML = `<div class="note">Binary file · ${b.size ?? 0} → ${a.size ?? 0} bytes</div>`;
    }
    return;
  }
  const { html, adds, dels } = renderDiff(b.text, a.text);
  $('counts').innerHTML = `${VERB[kind(c)]} · <span class="a">+${adds}</span> <span class="d">−${dels}</span>`;
  $('viewer').innerHTML = html;
}

// Line diff: trim common prefix/suffix, LCS on the middle, show hunks with 3 lines of context.
function diffLines(x, y) {
  let s = 0;
  while (s < x.length && s < y.length && x[s] === y[s]) s++;
  let ex = x.length, ey = y.length;
  while (ex > s && ey > s && x[ex - 1] === y[ey - 1]) { ex--; ey--; }
  const X = x.slice(s, ex), Y = y.slice(s, ey);
  const ops = [];
  for (let i = 0; i < s; i++) ops.push(['=', x[i]]);
  if (X.length * Y.length > 4e6) {
    X.forEach((l) => ops.push(['-', l])); Y.forEach((l) => ops.push(['+', l]));
  } else {
    const n = X.length, m = Y.length;
    const L = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      L[i][j] = X[i] === Y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (X[i] === Y[j]) { ops.push(['=', X[i]]); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) ops.push(['-', X[i++]]);
      else ops.push(['+', Y[j++]]);
    }
    while (i < n) ops.push(['-', X[i++]]);
    while (j < m) ops.push(['+', Y[j++]]);
  }
  for (let i = ex; i < x.length; i++) ops.push(['=', x[i]]);
  return ops;
}

function renderDiff(before, after) {
  const split = (t) => (t === '' ? [] : t.replace(/\r\n/g, '\n').replace(/\n$/, '').split('\n'));
  const ops = diffLines(split(before), split(after));
  const adds = ops.filter((o) => o[0] === '+').length, dels = ops.filter((o) => o[0] === '-').length;
  if (!adds && !dels) return { html: '<div class="note">No text differences (whitespace or line endings only).</div>', adds, dels };
  const show = new Array(ops.length).fill(false);
  ops.forEach((o, k) => { if (o[0] !== '=') for (let d = -3; d <= 3; d++) if (ops[k + d]) show[k + d] = true; });
  let out = '', ln = 0, rn = 0, skipped = 0;
  const gap = () => `<div class="gap">⋯ ${plural(skipped, 'unchanged line')}</div>`;
  ops.forEach((o, k) => {
    if (o[0] !== '+') ln++;
    if (o[0] !== '-') rn++;
    if (!show[k]) { skipped++; return; }
    if (skipped) { out += gap(); skipped = 0; }
    const cls = o[0] === '+' ? 'add' : o[0] === '-' ? 'del' : '';
    out += `<div class="ln ${cls}"><span class="num">${o[0] === '+' ? '' : ln}</span><span class="num">${o[0] === '-' ? '' : rn}</span><span class="sign">${o[0] === '=' ? '' : o[0] === '-' ? '−' : '+'}</span><span class="code">${esc(o[1]) || ' '}</span></div>`;
  });
  if (skipped) out += gap();
  return { html: `<div class="diff">${out}</div>`, adds, dels };
}

function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = `toast show${err ? ' err' : ''}`;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.className = 'toast'; }, 3500);
}

// Two-click confirmation instead of a blocking dialog.
function confirmButton(btn, action) {
  const label = btn.innerHTML;
  btn.onclick = async () => {
    if (!btn.classList.contains('confirm')) {
      btn.classList.add('confirm'); btn.textContent = 'Click again to confirm';
      setTimeout(() => { if (btn.isConnected) { btn.classList.remove('confirm'); btn.innerHTML = label; } }, 3000);
      return;
    }
    try { await action(); } catch (e) { toast(e.message, true); }
  };
}

async function restore(body) {
  const r = await api('/api/restore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  toast(r.restored ? `✓ Restored ${plural(r.restored, 'file')}. This restore can be undone too.` : 'Already in that state, nothing to do.');
  await load(true);
}

$('slider').oninput = (ev) => { stop(); select(Number(ev.target.value), true); };

function stop() { clearInterval(playing); playing = null; $('play').innerHTML = ICON_PLAY; }
$('play').innerHTML = ICON_PLAY;
$('play').onclick = () => {
  if (playing) return stop();
  if (!events.length) return;
  if (idx >= events.length - 1) select(0, true);
  $('play').innerHTML = ICON_PAUSE;
  playing = setInterval(() => { if (idx >= events.length - 1) stop(); else select(idx + 1, true); }, 1100);
};

document.addEventListener('keydown', (ev) => {
  if (ev.target === $('slider') && ev.key !== ' ') return; // the range input handles its own arrows
  if (ev.key === 'ArrowLeft' && idx > 0) { stop(); select(idx - 1, true); }
  else if (ev.key === 'ArrowRight' && idx < events.length - 1) { stop(); select(idx + 1, true); }
  else if (ev.key === ' ') { ev.preventDefault(); $('play').click(); }
});

load(true).catch((e) => { $('main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
setInterval(() => {
  if (playing) return;
  api('/api/events').then((d) => { if (d.events.length !== events.length) load(idx === events.length - 1); }).catch(() => {});
}, 3000);
</script>
